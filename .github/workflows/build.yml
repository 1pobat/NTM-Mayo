name: HBM Mayonnaise checks and build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_run_id:
        description: "Run ID containing owner-supplied ntm-next-local-dependency artifact"
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and exercise dependency-free mechanics
        run: python3 tools/check_core.py
  addon:
    if: github.event_name == 'workflow_dispatch' && inputs.dependency_run_id != ''
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Obtain user-supplied local NTM binary (do not build upstream)
        uses: actions/download-artifact@v4
        with:
          name: ntm-next-local-dependency
          path: ntmjar
          run-id: ${{ inputs.dependency_run_id }}
          github-token: ${{ github.token }}
      - name: Audit dependency
        run: python3 tools/audit_ntm.py ntmjar/ntm-next.jar --output build/ntm-api.json
      - name: Build addon with Java 25 and NeoForge
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: hbmmayo-build
          path: build/libs/*.jar
          if-no-files-found: error
